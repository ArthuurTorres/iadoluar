services:
  ia-sdr:
    build: .
    ports:
      - "4000:4000"
    restart: unless-stopped
    command: node --watch src/server.js
    environment:
      - NODE_ENV=development
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules
    networks:
      - ia-sdr-evo-net

networks:
  ia-sdr-evo-net:
    external: true